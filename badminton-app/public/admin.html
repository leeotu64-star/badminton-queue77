<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>장군봉 배드민턴 관리자</title>


<style>

*{
    box-sizing:border-box;
    font-family:
        "Malgun Gothic",
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#f1f3f5;
    padding:20px;
    color:#111827;
}

.main-card{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    background:#fff;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:27px;
}

.sub{
    margin:7px 0 0;
    color:#64748b;
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.limit{
    background:#f8fafc;
    border:1px solid #dbe2e8;
    border-radius:9px;
    padding:7px 9px;
    font-size:13px;
    font-weight:bold;
}

.limit input{
    width:55px;
    height:30px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 13px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.88;
}

.dark{
    background:#1e293b;
    color:#fff;
}

.orange{
    background:#f59e0b;
    color:#fff;
}

.pink{
    background:#ec4899;
    color:#fff;
}

.blue{
    background:#1769aa;
    color:#fff;
}

.green{
    background:#16a34a;
    color:#fff;
}

.gray{
    background:#64748b;
    color:#fff;
}

.red{
    background:#ef4444;
    color:#fff;
}


.grid{
    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:12px;

    width:100%;
}


.court{
    width:100%;
    min-width:0;

    background:#f8fafc;

    border:1px solid #dce3ea;

    border-radius:15px;

    padding:14px;

    min-height:390px;

    display:flex;
    flex-direction:column;
}

.court-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:5px;

    margin-bottom:10px;
}

.court-name{
    font-size:19px;
    font-weight:800;
    white-space:nowrap;
}

.badge{
    background:#fff;

    border:1px solid #d2dae2;

    border-radius:20px;

    padding:4px 7px;

    font-size:11px;

    font-weight:bold;

    white-space:nowrap;
}

.status{
    width:100%;

    text-align:center;

    border-radius:8px;

    padding:8px;

    margin-bottom:9px;

    font-size:12px;

    font-weight:bold;
}

.status.open{
    background:#dcfce7;
    color:#166534;
}

.status.closed{
    background:#fee2e2;
    color:#991b1b;
}

.list{
    flex:1;

    overflow-y:auto;

    min-height:170px;
    max-height:220px;
}

.empty{
    text-align:center;

    color:#94a3b8;

    padding:55px 5px;

    font-size:13px;
}

.person{
    background:#fff;

    border:1px solid #e2e8f0;

    border-radius:8px;

    padding:8px;

    margin-bottom:6px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:5px;
}

.info{
    min-width:0;

    display:flex;

    align-items:center;

    gap:5px;
}

.num{
    color:#0284c7;

    font-weight:800;

    min-width:17px;
}

.name{
    font-size:12px;

    font-weight:bold;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.type{
    background:#e0f2fe;

    color:#0369a1;

    border-radius:4px;

    padding:3px 5px;

    font-size:9px;

    white-space:nowrap;
}

.delete{
    flex-shrink:0;

    border:0;

    background:#ef4444;

    color:#fff;

    border-radius:5px;

    padding:5px 6px;

    font-size:10px;

    cursor:pointer;
}

.bottom{
    display:flex;

    gap:5px;

    margin-top:10px;
}

.bottom button{
    flex:1;

    padding:9px 4px;

    font-size:11px;
}

.message{
    display:none;

    padding:11px;

    border-radius:9px;

    margin-bottom:15px;

    text-align:center;

    font-size:13px;

    font-weight:bold;
}

.message.show{
    display:block;
}

.message.success{
    background:#e8f7ee;
    color:#147a3d;
}

.message.error{
    background:#fdeaea;
    color:#b42318;
}


@media(max-width:1100px){

    .grid{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}


@media(max-width:700px){

    body{
        padding:8px;
    }

    .main-card{
        padding:14px;
        border-radius:15px;
    }

    .grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:9px;
    }

    .court{
        min-height:350px;
        padding:10px;
    }

    .court-name{
        font-size:16px;
    }

}


@media(max-width:430px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="main-card">


<div class="header">

<div>

<h1>
장군봉 배드민턴 관리자
</h1>

<p class="sub">
코트별 실시간 대기 현황 및 관리
</p>

</div>


<div class="controls">


<div class="limit">

최대 정원

<input
    id="limitInput"
    type="number"
    min="1"
    max="99"
    value="5"
>

명

</div>


<button
    class="btn dark"
    onclick="changeLimit()"
>
변경
</button>


<button
    class="btn orange"
    onclick="resetAll()"
>
전체 번호 초기화
</button>


<button
    class="btn pink"
    onclick="clearAll()"
>
전체 코트 비우기
</button>


<button
    class="btn blue"
    onclick="loadData()"
>
새로고침
</button>


</div>

</div>


<div
    id="message"
    class="message"
></div>


<div
    id="grid"
    class="grid"
></div>


</div>


<script>

const API = "/api";


let data = {

    list:[],

    locks:{
        "1번 코트":false,
        "2번 코트":false,
        "3번 코트":false,
        "4번 코트":false,
        "5번 코트":false
    },

    maxLimit:5

};


/* ==============================
   메시지
============================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message show " + type;

    setTimeout(function(){

        box.className = "message";

    },2500);

}


/* ==============================
   API
============================== */

async function api(action,data={}){

    const response =
        await fetch(API,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                action,
                ...data
            })

        });


    const result =
        await response.json();


    if(!response.ok){

        throw new Error(
            result.message ||
            "서버 오류가 발생했습니다."
        );

    }


    return result;

}


/* ==============================
   데이터
============================== */

async function loadData(){

    try{

        const response =
            await fetch(
                API + "?action=get"
            );


        const result =
            await response.json();


        data = result;


        if(!Array.isArray(data.list)){
            data.list = [];
        }


        document.getElementById(
            "limitInput"
        ).value =
            data.maxLimit || 5;


        render();

    }
    catch(error){

        showMessage(
            "서버 연결을 확인해주세요.",
            "error"
        );

    }

}


/* ==============================
   화면
============================== */

function render(){

    const grid =
        document.getElementById("grid");


    let html = "";


    for(let i=1;i<=5;i++){

        const court =
            i + "번 코트";


        const list =
            data.list.filter(
                item =>
                    item.court === court
            );


        const locked =
            data.locks[court] === true;


        html += `

<div class="court">

<div>

<div class="court-head">

<div class="court-name">
${court}
</div>

<div class="badge">
${list.length}명 /
최대 ${data.maxLimit || 5}명
</div>

</div>


<div class="status ${
    locked
    ? "closed"
    : "open"
}">

${
    locked
    ? "등록 완료"
    : "등록 가능"
}

</div>


<div class="list">

`;


        if(list.length === 0){

            html += `

<div class="empty">
대기 중인 인원이 없습니다.
</div>

`;

        }
        else{

            list.forEach(function(item,index){

                html += `

<div class="person">

<div class="info">

<span class="num">
${index + 1}
</span>

<span class="name">
${escapeHtml(item.nickname)}
</span>

<span class="type">
${escapeHtml(item.game)}
</span>

</div>


<button
class="delete"
onclick="deletePerson('${item.id}')"
>
삭제
</button>

</div>

`;

            });

        }


        html += `

</div>

</div>


<div class="bottom">

`;


        if(locked){

            html += `

<button
class="btn green"
onclick="unlockCourt('${court}')"
>
등록 완료 해제
</button>

`;

        }
        else{

            html += `

<button
class="btn gray"
onclick="lockCourt('${court}')"
>
등록 완료
</button>

`;

        }


        html += `

<button
class="btn red"
onclick="clearCourt('${court}')"
>
코트 비우기
</button>

</div>

</div>

`;

    }


    grid.innerHTML = html;

}


/* ==============================
   등록 완료
============================== */

async function lockCourt(court){

    try{

        await api(
            "setLock",
            {
                court,
                locked:true
            }
        );


        showMessage(
            court +
            " 등록 완료",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   등록 완료 해제
============================== */

async function unlockCourt(court){

    try{

        await api(
            "setLock",
            {
                court,
                locked:false
            }
        );


        showMessage(
            court +
            " 등록 완료 해제",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   개별 삭제
============================== */

async function deletePerson(id){

    if(!confirm(
        "이 대기자를 삭제하시겠습니까?"
    )){
        return;
    }


    try{

        await api(
            "delete",
            {
                id
            }
        );


        showMessage(
            "삭제되었습니다.",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   코트 비우기
============================== */

async function clearCourt(court){

    if(!confirm(
        court +
        "의 대기자를 모두 삭제하시겠습니까?"
    )){
        return;
    }


    try{

        await api(
            "clearCourt",
            {
                court
            }
        );


        showMessage(
            court +
            " 대기자를 삭제했습니다.",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   전체 비우기
============================== */

async function clearAll(){

    if(!confirm(
        "1~5번 코트의 대기자를 모두 삭제하시겠습니까?"
    )){
        return;
    }


    try{

        await api(
            "clearAll"
        );


        showMessage(
            "전체 코트를 비웠습니다.",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   번호 초기화
============================== */

async function resetAll(){

    if(!confirm(
        "전체 대기번호를 초기화하시겠습니까?"
    )){
        return;
    }


    try{

        await api(
            "reset"
        );


        showMessage(
            "전체 대기번호가 초기화되었습니다.",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   최대 정원
============================== */

async function changeLimit(){

    const value =
        Number(
            document.getElementById(
                "limitInput"
            ).value
        );


    if(
        !Number.isInteger(value) ||
        value < 1 ||
        value > 99
    ){

        alert(
            "최대 정원은 1~99명으로 입력하세요."
        );

        return;

    }


    try{

        await api(
            "setLimit",
            {
                value
            }
        );


        showMessage(
            "최대 정원이 " +
            value +
            "명으로 변경되었습니다.",
            "success"
        );


        loadData();

    }
    catch(error){

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==============================
   HTML 안전 처리
============================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==============================
   시작
============================== */

window.addEventListener(
    "load",
    function(){

        render();

        loadData();

    }
);


/* ==============================
   자동 새로고침
============================== */

setInterval(
    loadData,
    5000
);

</script>

</body>
</html>
