<style id="adminPolish">
/* 관리자 화면 정리용 디자인 - 기능/동작은 변경하지 않음 */
.admin{
  min-height:calc(100vh - 72px);
  background:#f3f6fa;
  display:grid;
  grid-template-columns:150px 1fr;
}
.side{
  background:#071b45;
  padding:22px 10px;
  position:sticky;
  top:0;
  height:calc(100vh - 72px);
  box-sizing:border-box;
}
.side h2{
  font-size:15px;
  margin:0 0 16px;
  padding:8px 10px;
  color:#fff;
}
.nav{
  padding:13px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
  transition:.15s;
}
.nav.on{background:#1466e8}
.nav:hover{background:#123b7f}
.main{
  padding:20px 22px 35px;
  max-width:1700px;
  width:100%;
  box-sizing:border-box;
}
.panel{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:12px;
  margin-bottom:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(18,38,70,.05);
}
.panel h2{
  font-size:20px;
  margin:0 0 5px;
  color:#10244b;
}
.hint{color:#718096;font-size:12px}
.lockGrid,.controlRow,.grid{
  gap:10px;
}
.lockCard{
  border:1px solid #dce4ee;
  border-radius:10px;
  background:#fbfcfe;
  padding:14px;
  box-shadow:none;
}
.lockCard h3{
  font-size:17px;
  margin:0 0 8px;
}
.lockCard p{
  color:#64748b;
  margin:5px 0 12px;
  font-size:12px;
}
.lockCard button{
  width:100%;
  min-height:38px;
  border-radius:7px;
  font-weight:900;
}
.controlBox{
  background:#fbfcfe;
  border:1px solid #dce4ee;
  border-radius:10px;
  padding:16px;
}
.controlBox h3{
  margin:0 0 12px;
  font-size:16px;
}
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.stepper button{
  width:38px;
  height:36px;
  border-radius:7px;
  font-size:18px;
  font-weight:900;
}
.stepper strong{
  min-width:38px;
  text-align:center;
  font-size:21px;
}
.adminSave{
  margin-top:13px;
  min-width:130px;
}
.adminTable .grid{
  align-items:stretch;
}
.adminTable .card{
  min-height:145px;
  background:#fbfcfe;
  border:1px solid #d9e2ee;
  border-radius:10px;
  padding:13px;
  box-sizing:border-box;
}
.adminTable .card h3{
  font-size:16px;
  color:#10244b;
  padding-bottom:9px;
  margin-bottom:8px;
  border-bottom:1px solid #e6ebf2;
}
.adminTable .card p{
  margin:7px 0;
  font-size:12px;
  line-height:1.5;
}
.adminTable .card p:first-of-type{
  background:#eef4ff;
  border-radius:7px;
  padding:8px;
  font-weight:800;
}
.adminTable .smallbtn{
  float:right;
  background:#e53935;
  color:#fff;
  border:0;
  border-radius:6px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.adminTable .smallbtn:hover{background:#c62828}
.adminTop a{
  background:#1466e8;
  border-radius:7px;
  padding:9px 15px;
  font-weight:900;
}
@media(max-width:950px){
  .admin{grid-template-columns:1fr}
  .side{position:relative;height:auto}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>

function findDeviceRegistration(s,deviceId){

function getReRegisterUntil(s,fin){
  const stored=Number(fin?.reRegisterUntil||0);
  if(stored>0)return stored;
  const ended=Number(fin?.endedAt||0);

}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function tm(t){return new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}
function left(t){let n=Math.max(0,Math.ceil((t-Date.now())/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}

}

function kstDateKey(t=Date.now()){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(t));
}
function resetHistoryForNewDay(s){
  s.finished=s.finished||{};
  const today=kstDateKey();
  if(s.finished._historyDate!==today){
    const oldDate=s.finished._historyDate;
    const oldHistory=s.finished._history||{};
    s.finished._insightHistory=s.finished._insightHistory||{};
    if(oldDate && Object.keys(oldHistory).length){
      const recs=Object.values(oldHistory).filter(v=>v&&typeof v==="object");
      let games=0,qr=0,waitSum=0,waitN=0,used=0;
      for(const r of recs){if(r.source==="qr"||r.deviceId)qr++;if(r.startAt){games++;if(r.createdAt){waitSum+=Math.max(0,(Number(r.startAt)-Number(r.createdAt))/60000);waitN++}}}
      s.finished._insightHistory[oldDate]={date:oldDate,teams:recs.length,games,qr,queue:0,avgWait:waitN?Math.round(waitSum/waitN):0,util:0,courts:8};
    }
    const keep={};
    for(const [k,v] of Object.entries(s.finished)){
      if(k==="_historyDate"||k==="_history")continue;
      if(v && typeof v==="object" && v.source!=="qr") keep[k]=v;
    }
    keep._insightHistory=s.finished._insightHistory||{};
    s.finished=keep;
    s.finished._historyDate=today;
    s.finished._history={};
    return true;
  }
  if(!s.finished._history) s.finished._history={};
  if(!s.finished._insightHistory) s.finished._insightHistory={};
  return false;
}
async function advance(s,doSave=true){
  s.finished=s.finished||{};
  let ch=resetHistoryForNewDay(s);
  for(const c of s.courts){
    if(c.active && Date.now()>=Number(c.active.endAt)){
      const a=c.active;
      const endedAt=Date.now();
      const record={...a,source:"qr",endedAt,deviceId:(a.deviceId||getDeviceToken()),reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000};
      s.finished[a.ticket]=record;
      s.finished._history=s.finished._history||{};
      s.finished._history[a.ticket]=record;
      c.active=null; ch=true;
    }
    if(!c.active && !c.blocked && (c.queue||[]).length){
      const x=c.queue.shift();
      const m=Number(s.settings[x.game]||15);
      const st=Date.now();
      const et=st+m*60000;
      c.active={
        ...x,
        startAt:st,
        endAt:et,
        startTime:tm(st),
        endTime:tm(et)
      };
      ch=true;
    }
  }
  if(ch && doSave) await save(s);
  return s;
}

}

/* GitHub Pages compatible routing:
   /#register
   /?page=admin
   /?page=waiting&ticket=...
   Existing /register, /admin, /waiting paths are also supported. */
function route(){
  const path=location.pathname.replace(/\/+$/,"");
  const page=params.get("page")||"";
  if(page==="management") return "management";
  if(page==="insight") return "insight";
  if(path==="/admin" || path.endsWith("/admin") || page==="admin") return "admin";
  if(path==="/register" || path.endsWith("/register") || page==="register") return "register";
  if(path==="/waiting" || path.endsWith("/waiting") || page==="waiting" || ticket) return "waiting";
  return "customer";
}

async function loadRegisterDuration(){
  const game=document.getElementById("g"), out=document.getElementById("duration");
  if(!game||!out)return;
  let timer=null;
  const sync=async()=>{
    try{
      const s=await get();
      out.textContent=(s.settings?.[game.value]||15)+"분";
      const cm=document.getElementById("cooldownMinutes");
      if(cm) cm.textContent=(Number(s.re_register_minutes)||5)+"분";
    }catch(e){}
  };
  game.addEventListener("change",sync);
  await sync();
  timer=setInterval(sync,2000);
  window.addEventListener("beforeunload",()=>{if(timer)clearInterval(timer)},{once:true});

function nextAutoLabel(state){
  const pool=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ"];
  const used=new Set();
  for(const c of (state?.courts||[])){
    if(c?.active?.nickname) used.add(String(c.active.nickname));
    for(const x of (Array.isArray(c?.queue)?c.queue:[])){
      if(x?.nickname) used.add(String(x.nickname));
    }
  }
  return pool.find(v=>!used.has(v)) || ("대기"+(used.size+1));
}

async function reg(){
  const btn=document.getElementById("regBtn"), ee=document.getElementById("e");
  const gg=document.getElementById("g").value;
  const id=Number(document.getElementById("c").value);
  const deviceId=getDeviceToken();

  const err=(msg)=>{
    ee.style.display="block";
    ee.textContent=msg;
    btn.disabled=false; btn.style.opacity="1";
  };

  if(!gg||!id){err("게임 방식과 코트를 선택해주세요.");return}

  /* 같은 스마트폰의 5분 재등록 제한 */
  const cooldown=getCooldownUntil();
  if(cooldown>Date.now()){
    err("⚠️ 이미 등록했습니다. "+cooldownMessage(cooldown));
    return;
  }

  btn.disabled=true; btn.style.opacity=".65"; ee.style.display="none";

  try{
    let s=await get();
    if(!s || !Array.isArray(s.courts)) s=cloneDef();
    s.settings=s.settings||{"난타":15,"4인 복식":15,"2인 단식":15};
    s.max_per_court=Math.max(1,Math.min(20,Number(s.max_per_court||5)));
    s.re_register_minutes=Math.max(1,Math.min(20,Number(s.re_register_minutes||5)));
    s.finished=s.finished||{};
    const nn=nextAutoLabel(s);

    /* 서버에 저장된 익명 기기 토큰으로 모든 코트의 중복 대기/이용 여부 검사 */
    const existing=findDeviceRegistration(s,deviceId);
    if(existing){
      err("⚠️ 이미 대기 등록되어 있습니다.\n기존 대기를 취소하거나 이용을 마친 후 다시 등록해주세요.");
      return;
    }

    const x=s.courts.find(v=>Number(v.id)===id);
    if(!x){err("선택한 코트를 찾을 수 없습니다.");return}
    if(x.blocked){err("현재 이용할 수 없는 코트입니다. 다른 코트를 선택해주세요.");return}

    x.queue=Array.isArray(x.queue)?x.queue:[];
    const total=x.queue.length+(x.active?1:0);
    if(total>=s.max_per_court){err("선택한 코트의 대기가 마감되었습니다.");return}

    const t=(crypto&&crypto.randomUUID)?crypto.randomUUID():
      ("T"+Date.now()+Math.random().toString(36).slice(2));

    /* QR에는 개인정보가 없고, 대기 데이터에도 익명 랜덤 토큰만 저장 */
    x.queue.push({
      ticket:t,
      nickname:nn,
      game:gg,
      court:id,
      createdAt:Date.now(),
      deviceId:deviceId,
      source:"qr"
    });

    // 1번 등록자는 즉시 이용 중(active), 이후 등록자는 대기열(queue)로 들어감
    await advance(s,false);

    // 변경된 active/queue 상태와 현재 대기 정원을 서버에 확실히 저장
    await save(s);

    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(t));
  }catch(e){
    console.error(e);
    err(String(e?.message||e));
  }
}

    w.innerHTML=`

async function cancelWait(){
  try{
    let s=await get();
    s.finished=s.finished||{};
    resetHistoryForNewDay(s);
    let removed=null;
    for(const c of s.courts){
      const q=c.queue||[];
      const found=q.find(x=>x.ticket===ticket);
      if(found)removed={...found,court:c.id};
      c.queue=q.filter(x=>x.ticket!==ticket);
    }
    if(removed){
      const endedAt=Date.now();
      const record={
        ...removed,
        source:"qr",
        endedAt,
        canceled:true,
        deviceId:(removed.deviceId||getDeviceToken()),
        reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000
      };
      s.finished[ticket]=record;
      s.finished._history=s.finished._history||{};
      s.finished._history[ticket]=record;
    }
    await save(s);
    location.replace(location.pathname+"?page=waiting&ticket="+encodeURIComponent(ticket));
  }catch(e){showError(e)}
}
async function leave(){
  try{
    let s=await get();
    s.finished=s.finished||{};
    resetHistoryForNewDay(s);
    for(const c of s.courts){
      if(c.active?.ticket===ticket){
        const endedAt=Date.now(); const record={...c.active,source:"qr",endedAt,deviceId:(c.active.deviceId||getDeviceToken()),reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000};
        s.finished[ticket]=record;
        s.finished._history=s.finished._history||{};
        s.finished._history[ticket]=record;
        c.active=null;
      }
    }
    await advance(s);
    await save(s);
  }catch(e){showError(e)}
}
async function finish(){
  try{let s=await get();if(s.finished)delete s.finished[ticket];await save(s);location.href="#register"}catch(e){showError(e)}
}

async function resetHistory(){
  if(!confirm("오늘 이용 기록을 모두 초기화할까요?\n현재 이용 중/대기 중인 팀은 삭제하지 않습니다."))return;

function changeTime(game,delta){
  const el=game==="난타"?document.getElementById("g1"):game==="4인 복식"?document.getElementById("g2"):document.getElementById("g3");
  if(!el)return;
  const value=Math.max(1,Math.min(20,Number(el.textContent||15)+delta));

  adminSettingsDirty=true;
  if(game==="난타")adminDraft.g1=value;
  else if(game==="4인 복식")adminDraft.g2=value;
  else adminDraft.g3=value;
}

}
function changeCooldown(delta){
  const el=document.getElementById("rc"); if(!el)return;
  const value=Math.max(1,Math.min(20,Number(el.textContent||5)+delta));

}

async function saveWithSettings(s){
  /* 관리자 설정은 해당 필드만 저장하여 고객 상태 저장과 충돌하지 않게 합니다. */
  await sbUpsert({
    id:ROOT,
    settings:s.settings,
    max_per_court:s.max_per_court,
    re_register_minutes:Math.max(1,Math.min(20,Number(s.re_register_minutes||5))),
    finished:s.finished||{},
    courts:s.courts
  });
}

async function saveGameTime(){

    const saved=await get();
    renderAdmin(saved);
    alert("변경사항이 저장되었습니다.");
  }catch(e){showError(e)}
}
async function block(id,b){
  try{
    let s=await get();
    const c=s.courts.find(c=>c.id===id);
    if(!c)return;
    c.blocked=!!b;
    await save(s);
  }catch(e){showError(e)}
}
window.jgbBlock=function(id,b){ return block(id,b); };
async function force(id){
  try{
    let s=await get(),c=s.courts.find(c=>c.id===id);
    if(c.active){
      s.finished=s.finished||{};
      resetHistoryForNewDay(s);
      const endedAt=Date.now(); const record={...c.active,endedAt,deviceId:(c.active.deviceId||getDeviceToken()),forced:true,reRegisterUntil:endedAt+getReRegisterMinutes(s)*60000};
      s.finished[c.active.ticket]=record;
      s.finished._history=s.finished._history||{};
      s.finished._history[c.active.ticket]=record;
      c.active=null;
    }
    await advance(s); await save(s);
  }catch(e){showError(e)}
}

  if(!ok)return;

  if(!ok2)return;
  try{

    s.courts=(s.courts||[]).map(c=>({

    }));

    await save(s);

    if(new URLSearchParams(location.search).get("page")==="insight"){
      window.jgbInsightState=saved;
      renderInsight(saved);
      jgbRenderMonthlyYearly(saved);

  function showGate(route){if(document.getElementById("jgbAccessGate"))return;const gate=document.createElement("div");gate.id="jgbAccessGate";gate.style.cssText="position:fixed;inset:0;z-index:2147483647;background:#eef4fb;display:flex;align-items:center;justify-content:center;font-family:inherit;";gate.innerHTML='<div style="width:min(420px,88vw);background:#fff;border-radius:18px;padding:30px;box-shadow:0 18px 50px #102c5a22;text-align:center"><div style="font-size:30px">🔐</div><div style="font-size:22px;font-weight:950;color:#09265a;margin:10px 0 6px">77 관리자 접근</div><div style="font-size:13px;color:#667085;margin-bottom:18px">77 전용 관리자 비밀번호를 입력해주세요.</div><input id="jgbGatePw" type="password" inputmode="numeric" autocomplete="off" style="width:100%;box-sizing:border-box;padding:13px;font-size:18px;text-align:center;border:1px solid #ccd8e6;border-radius:10px"><button id="jgbGateBtn" type="button" style="width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:900;border:0;border-radius:10px;background:#0b63e8;color:#fff;cursor:pointer">확인</button><div id="jgbGateErr" style="min-height:20px;margin-top:10px;color:#d71939;font-size:12px;font-weight:800"></div></div>';document.body.appendChild(gate);const input=gate.querySelector('#jgbGatePw'),btn=gate.querySelector('#jgbGateBtn'),err=gate.querySelector('#jgbGateErr');function verify(){if(input.value===PASSWORD){localStorage.setItem(AUTH_KEY+'_'+route,'ok');gate.remove()}else{err.textContent='비밀번호가 올바르지 않습니다.';input.value='';input.focus()}}btn.onclick=verify;input.onkeydown=e=>{if(e.key==='Enter')verify()};input.focus()}
  function run(){const route=targetRoute();if(!route||localStorage.getItem(AUTH_KEY+'_'+route)==='ok')return;showGate(route)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
